<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b5148"/>
    </marker>
    <style>
      .frame { fill: #fbf8f2; stroke: #d8cdb8; stroke-width: 1.5; rx: 14; }
      .box { fill: #ffffff; stroke: #b9a98c; stroke-width: 1.2; rx: 8; }
      .gold { fill: #fff6df; stroke: #c8961e; stroke-width: 1.6; rx: 8; }
      .red { fill: #fff1ef; stroke: #c0392b; stroke-width: 1.8; rx: 8; }
      .judge { fill: #1f1a14; stroke: #c8961e; stroke-width: 1.4; rx: 8; }
      .h { font-size: 15px; font-weight: 700; fill: #2a241d; letter-spacing: .08em; }
      .t { font-size: 12.5px; fill: #2a241d; }
      .s { font-size: 11px; fill: #6b5f52; }
      .w { font-size: 12.5px; fill: #f3d58a; font-weight: 700; }
      .ws { font-size: 10.5px; fill: #e9e1d3; }
      .ln { stroke: #5b5148; stroke-width: 1.4; fill: none; marker-end: url(#a); }
      .dash { stroke: #c0392b; stroke-width: 1.4; stroke-dasharray: 6 5; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="20" y="34" font-size="20" font-weight="800" fill="#2a241d">Raven + Latent: system design</text>
  <text x="20" y="54" class="s">The model reads, code decides. Engines never see the hidden truth; only the eval harness does.</text>

  <!-- DATA -->
  <rect class="frame" x="16" y="72" width="240" height="560"/>
  <text x="32" y="98" class="h">DATA</text>
  <rect class="box" x="30" y="112" width="212" height="62"/>
  <text x="42" y="134" class="t">Synthetic bundles</text>
  <text x="42" y="152" class="s">P001-P042 + 18 fairness twins</text>
  <text x="42" y="166" class="s">CV, GitHub, Jira, HCM, certs, LMS</text>
  <rect class="box" x="30" y="186" width="212" height="56"/>
  <text x="42" y="208" class="t">Real pilot (gitignored)</text>
  <text x="42" y="226" class="s">friends' CVs, GitHub, portfolio</text>
  <rect class="box" x="30" y="254" width="212" height="56"/>
  <text x="42" y="276" class="t">Customer taxonomy</text>
  <text x="42" y="294" class="s">55 skills, level lines, exclude list</text>
  <rect class="red" x="30" y="512" width="212" height="62"/>
  <text x="42" y="534" class="t" font-weight="700">Hidden truth-v2</text>
  <text x="42" y="552" class="s">true level + oracle per skill</text>
  <text x="42" y="566" class="s">read by eval/ only</text>
  <line class="dash" x1="268" y1="80" x2="268" y2="290"/><line class="dash" x1="268" y1="430" x2="268" y2="640"/>
  <text x="262" y="360" class="s" fill="#c0392b" transform="rotate(-90 262 360)" text-anchor="middle">engines never read truth</text>

  <!-- PIPELINE -->
  <rect class="frame" x="282" y="72" width="380" height="560"/>
  <text x="298" y="98" class="h">ENGINE PIPELINE</text>
  <g>
    <rect class="box" x="298" y="110" width="348" height="40"/>
    <text x="310" y="128" class="t">1 Load + identity</text>
    <text x="310" y="143" class="s">stable ID wins, otherwise don't merge</text>
    <rect class="gold" x="298" y="160" width="348" height="46"/>
    <text x="310" y="179" class="t">2 Extract claims (LLM reads: Claude Haiku)</text>
    <text x="310" y="196" class="s">phrase, verbatim quote, evidence type, date; cached</text>
    <rect class="box" x="298" y="216" width="348" height="40"/>
    <text x="310" y="234" class="t">3 Verify quote in source: no quote, no record</text>
    <text x="310" y="249" class="s">prompt-injection safe: reader has no tools</text>
    <rect class="box" x="298" y="266" width="348" height="40"/>
    <text x="310" y="284" class="t">4 Map to taxonomy</text>
    <text x="310" y="299" class="s">aliases, ambiguity, exclude list, unmatched skills out</text>
    <rect class="box" x="298" y="316" width="348" height="40"/>
    <text x="310" y="334" class="t">5 Independent evidence groups + decay</text>
    <text x="310" y="349" class="s">CV versions count once; self-authored = one group</text>
    <rect class="frame" x="298" y="366" width="348" height="168" style="fill:#f3ece0"/>
    <text x="310" y="386" class="t" font-weight="700">6 Decide (code decides): three judges</text>
    <rect class="judge" x="308" y="396" width="106" height="128"/>
    <text x="318" y="418" class="w">Raven 1</text>
    <text x="318" y="436" class="ws">one LLM prompt</text>
    <text x="318" y="450" class="ws">over raw bundle</text>
    <text x="318" y="468" class="ws">(naive baseline)</text>
    <rect class="judge" x="420" y="396" width="106" height="128"/>
    <text x="430" y="418" class="w">Raven 2</text>
    <text x="430" y="436" class="ws">reference rules</text>
    <text x="430" y="450" class="ws">floor / ceiling</text>
    <text x="430" y="464" class="ws">caps, decay</text>
    <rect class="judge" x="532" y="396" width="106" height="128"/>
    <text x="542" y="418" class="w">Raven 3</text>
    <text x="542" y="436" class="ws">evidence clusters</text>
    <text x="542" y="450" class="ws">noisy-OR, level</text>
    <text x="542" y="464" class="ws">posterior, tau</text>
    <rect class="box" x="298" y="544" width="348" height="40"/>
    <text x="310" y="562" class="t">7 Send policy</text>
    <text x="310" y="577" class="s">max 3 skills, 3 quotes; hold / do-not-message</text>
    <path class="ln" d="M472 150 v10"/>
    <path class="ln" d="M472 206 v10"/>
    <path class="ln" d="M472 256 v10"/>
    <path class="ln" d="M472 306 v10"/>
    <path class="ln" d="M472 356 v10"/>
    <path class="ln" d="M472 534 v10"/>
    <rect class="gold" x="298" y="594" width="348" height="30"/>
    <text x="310" y="614" class="t">Decisions JSON + evidence trace</text>
  </g>
  <path class="ln" d="M242 143 H298"/>
  <path class="ln" d="M242 214 C270 214 270 135 298 133"/>
  <path class="ln" d="M242 282 H298"/>

  <!-- EVAL -->
  <rect class="frame" x="684" y="72" width="240" height="560"/>
  <text x="700" y="98" class="h">EVAL HARNESS</text>
  <rect class="box" x="698" y="112" width="212" height="56"/>
  <text x="710" y="134" class="t">Precision on sends</text>
  <text x="710" y="152" class="s">Wilson 95% CI, coverage</text>
  <rect class="box" x="698" y="178" width="212" height="40"/>
  <text x="710" y="203" class="t">Trap catch per fault</text>
  <rect class="box" x="698" y="228" width="212" height="40"/>
  <text x="710" y="253" class="t">Fairness twins, determinism</text>
  <rect class="box" x="698" y="278" width="212" height="56"/>
  <text x="710" y="300" class="t">Risk-coverage curve</text>
  <text x="710" y="318" class="s">tau fitted on calibration half</text>
  <rect class="box" x="698" y="344" width="212" height="40"/>
  <text x="710" y="369" class="t">Cost: tokens, $, latency</text>
  <rect class="box" x="698" y="394" width="212" height="40"/>
  <text x="710" y="419" class="t">Slice by persona generator</text>
  <rect class="gold" x="698" y="560" width="212" height="56"/>
  <text x="710" y="582" class="t">runs/latest/</text>
  <text x="710" y="600" class="s">summary, curve, traps, per_person</text>
  <path class="ln" d="M136 574 V648 H804 V616"/>
  <path class="ln" d="M646 609 H698"/>

  <!-- APP -->
  <rect class="frame" x="946" y="72" width="238" height="560"/>
  <text x="962" y="98" class="h">APP (local Mac)</text>
  <rect class="gold" x="960" y="112" width="210" height="140"/>
  <text x="972" y="134" class="t" font-weight="700">Latent mode</text>
  <text x="972" y="154" class="s">1 upload CV / GitHub / portfolio</text>
  <text x="972" y="170" class="s">2 self-rate, locked server-side</text>
  <text x="972" y="186" class="s">3 Ravens reveal one by one</text>
  <text x="972" y="202" class="s">4 verdict vs panel average</text>
  <text x="972" y="218" class="s">5 Yes/No + level feedback</text>
  <text x="972" y="238" class="s">(the real metric)</text>
  <rect class="box" x="960" y="262" width="210" height="96"/>
  <text x="972" y="284" class="t" font-weight="700">Engine room</text>
  <text x="972" y="302" class="s">scoreboard, curve, trap matrix</text>
  <text x="972" y="318" class="s">person explorer</text>
  <text x="972" y="334" class="s">Teams message preview</text>
  <text x="972" y="350" class="s">build ledger</text>
  <rect class="box" x="960" y="368" width="210" height="56"/>
  <text x="972" y="390" class="t">FastAPI + HTMX + Alpine</text>
  <text x="972" y="408" class="s">SQLite pilot.db (gitignored)</text>
  <rect class="box" x="960" y="434" width="210" height="56"/>
  <text x="972" y="456" class="t">Cloudflare quick tunnel</text>
  <text x="972" y="474" class="s">public link for friends, passcode</text>
  <path class="ln" d="M910 588 C935 588 935 320 960 310"/>
  <path class="ln" d="M960 140 H936 V64 H560 V110"/>
  <text x="700" y="60" class="s">live upload: app runs the pipeline for one person</text>

  <!-- FEEDBACK -->
  <rect class="frame" x="16" y="660" width="1168" height="80"/>
  <text x="32" y="686" class="h">REAL FEEDBACK LOOP</text>
  <text x="32" y="710" class="t">Friends play Latent: self-rating (before reveal) + "Do you have this skill?" Yes/No + "level too low / right / too high"</text>
  <text x="32" y="728" class="s">The only non-synthetic precision number. Stored in pilot.db and shown live in the engine room.</text>
  <path class="ln" d="M1065 490 V660"/>
</svg>
